apiVersion: 1
datasources:
  - name: InfluxDB-Edge
    uid: influx-edge
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    jsonData: {version: Flux, organization: "${INFLUXDB_ORG}", defaultBucket: edge}
    secureJsonData: {token: "${INFLUXDB_TOKEN}"}
  - name: InfluxDB-Cloud
    uid: influx-cloud
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    jsonData: {version: Flux, organization: "${INFLUXDB_ORG}", defaultBucket: cloud}
    secureJsonData: {token: "${INFLUXDB_TOKEN}"}
